[env:hiwonder_f407]
platform = ststm32@20.0.0
board = genericSTM32F407VET6
framework = arduino
; Serial bootloader upload is documented separately; no default ST-Link assumption.
; Use internal HSI clock: avoids depending on the generic board's crystal profile.
build_flags = -D HSI_VALUE=16000000U
monitor_speed = 115200
