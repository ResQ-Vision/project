"/></g><g locked="0"><text x="1035" y="534" font-family="Verdana" font-size="9pt" fill="#334155" text-anchor="start">CONTACT B</text><text x="1010" y="526" font-family="Verdana" font-size="7pt" fill="#334155" text-anchor="start" display="none">CONTACT B</text><path d="M 1010 530 h 20" fill="none" stroke="#334155" stroke-width="1"/><circle cx="1027" cy="530" r="3" stroke="#334155" fill="none" stroke-width="1" display="none"/><path d="M 1030 533 L 1033 530 L 1030 527" fill="none" stroke="#334155" stroke-width="1" display="none"/></g></g><g locked="0"><text x="1005" y="491" fill="#B91C1C" font-family="Arial" font-size="8pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">OPEN</text></g><g locked="0"><text x="1005" y="521" fill="#B91C1C" font-family="Arial" font-size="8pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">OPEN</text></g><g locked="0"><text x="35" y="880" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">X1 is a functional placeholder: no internal circuit or approved power-inhibit implementation exists.</text></g><g locked="0"><text x="35" y="904" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Battery is deliberately unconnected. A 3S pack reaches 12.6V; motor limits, BMS, charger and fusing need review.</text></g><g locked="0"><text x="35" y="928" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">VMOTOR_SW and 5V_ACT require independent hardware inhibition, disabled boot and explicit re-arm.</text></g><g locked="0"><text x="35" y="952" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Common GND is a signal reference; route motor/servo returns separately from logic. Wire sizes and protection TBD.</text></g><g locked="0"><text x="35" y="976" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">5V_LOGIC powers modules only; never connect 12V to ESP headers. Disconnect external 5V before USB power.</text></g><g locked="0"><text x="35" y="1020" fill="#172B4D" font-family="Arial" font-size="9pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Sheet 1/5 - Source: design.json and docs/hardware/electrical-chart.md</text></g></g></svg>