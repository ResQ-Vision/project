5" text-anchor="end">LIDAR_USB_GND</text><path d="M 925 489 L 925 491 M 924 490 L 926 490" stroke-width="1.96079"/></g><g locked="0"><text x="35" y="880" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Wireless links are text only, not copper: C3 -&gt; Motion ESP32 directly; motion/camera &lt;-&gt; one laptop by Wi-Fi.</text></g><g locked="0"><text x="35" y="904" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">C3 input controls/deadman and radio protocol remain TBD. Its USB power domain is separate from the rover.</text></g><g locked="0"><text x="35" y="928" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">LiDAR bench path: supplied USB adapter -&gt; laptop USB data + power. Raw sensor connector is not assigned.</text></g><g locked="0"><text x="35" y="952" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Untethered LiDAR acquisition bridge is UNRESOLVED; no Pi, assumed UART bridge, or separate ToF is added.</text></g><g locked="0"><text x="35" y="976" fill="#334155" font-family="Arial" font-size="11pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Camera power-only USB cable from 5V_LOGIC; avoid a second USB power source. Laptop AI is advisory only.</text></g><g locked="0"><text x="35" y="1020" fill="#172B4D" font-family="Arial" font-size="9pt" font-weight="" font-style="" dominant-baseline="" text-anchor="start" type="comment">Sheet 5/5 - Source: design.json and docs/hardware/electrical-chart.md</text></g></g></svg>